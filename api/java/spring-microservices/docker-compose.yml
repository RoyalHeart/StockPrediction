services:
  eureka:
    container_name: eureka
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - spring-network
  gateway:
    container_name: gateway
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    ports:
      - "8800:8800"
    env_file: .env
    depends_on:
      - eureka
    networks:
      - spring-network
  auth:
    container_name: auth
    build:
      context: ./service-auth
      dockerfile: Dockerfile
    ports:
      - "8020:8020"
    env_file: .env
    depends_on:
      - eureka
      - gateway
    networks:
      - spring-network
  data:
    container_name: data
    build:
      context: ./service-data
      dockerfile: Dockerfile
    ports:
      - "8030:8030"
    env_file: .env
    depends_on:
      - eureka
      - gateway
      - auth
    networks:
      - spring-network
    dns:
      - 8.8.8.8
      - 4.4.4.4
